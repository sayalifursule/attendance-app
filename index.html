<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Attendance Management System</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Smart Attendance Dashboard</h1>

        <p>Smart Student Attendance Tracker</p>

    </div>

    <div class="dashboard">

        <div class="card">
            <h2 id="totalStudents">0</h2>
            <p>Total Records</p>
        </div>

        <div class="card">
            <h2 id="presentCount">0</h2>
            <p>Present</p>
        </div>

        <div class="card">
            <h2 id="absentCount">0</h2>
            <p>Absent</p>
        </div>

    </div>

    <div class="main-card">

        <form id="attendanceForm">

            <div class="form-group">

                <input type="text"
                       id="studentName"
                       placeholder="Student Name"
                       required>

                <input type="text"
                       id="subject"
                       placeholder="Subject"
                       required>

            </div>

            <div class="form-group">

                <input type="date"
                       id="date"
                       required>

                <select id="status">

                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>

                </select>

            </div>

            <button type="submit">
                Add Attendance
            </button>

        </form>

    </div>

    <div class="table-section">

        <div class="table-header">

            <h2>Attendance Records</h2>

            <input type="text"
                   id="searchInput"
                   placeholder="Search Student">

        </div>

        <table>

            <thead>

            <tr>

                <th>Name</th>
                <th>Subject</th>
                <th>Date</th>
                <th>Status</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody id="attendanceTable">

            </tbody>

        </table>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
